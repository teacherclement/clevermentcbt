services:
  # FRONTEND ONLY. The backend runs as a separate Render Web Service.
  - type: web
    name: cleverment
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    headers:
      # Never let the browser cache core frontend files on its own.
      # Always revalidate so a new frontend deploy is picked up immediately.
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /script.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /style.css
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
